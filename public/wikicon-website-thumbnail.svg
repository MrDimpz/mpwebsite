      <rect x="72" y="0" width="62" height="54" rx="10" fill="url(#wcCyan)"/>
      <text x="103" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="800" fill="#060913">K</text>

      <rect x="144" y="0" width="62" height="54" rx="10" fill="url(#wcCyan)"/>
      <text x="175" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="800" fill="#060913">Y</text>

      <rect x="0" y="64" width="62" height="54" rx="10" fill="#1f2744" stroke="rgba(255,255,255,0.15)"/>
      <text x="31" y="99" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="800" fill="#f8fafc">P</text>

      <rect x="72" y="64" width="62" height="54" rx="10" fill="#1f2744" stroke="rgba(255,255,255,0.15)"/>
      <text x="103" y="99" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="800" fill="#f8fafc">O</text>

      <rect x="144" y="64" width="62" height="54" rx="10" fill="#1f2744" stroke="rgba(255,255,255,0.15)"/>
      <text x="175" y="99" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="800" fill="#f8fafc">L</text>
