    <text x="24" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#ffd45e" letter-spacing="1">ARTICLE TITLE: AURORA BOREALIS</text>

    <!-- Redacted & Revealed Tokens -->
    <rect x="24" y="54" width="44" height="28" rx="6" fill="rgba(255,255,255,0.06)"/>
    <text x="46" y="73" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">An</text>

    <rect x="76" y="54" width="92" height="28" rx="6" fill="rgba(255, 212, 94, 0.22)" stroke="#ffd45e"/>
    <text x="122" y="73" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#ffd45e">AURORA</text>

    <rect x="176" y="54" width="36" height="28" rx="6" fill="rgba(255,255,255,0.06)"/>
    <text x="194" y="73" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">is</text>

    <rect x="220" y="54" width="84" height="28" rx="6" fill="#1a213b" stroke="rgba(148,163,184,0.28)"/>
    <text x="262" y="73" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#94a3b8">7</text>

    <rect x="312" y="54" width="88" height="28" rx="6" fill="rgba(25, 228, 255, 0.18)" stroke="#19e4ff"/>
    <text x="356" y="73" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#19e4ff">LIGHT</text>

    <!-- Line 2 -->
    <rect x="24" y="96" width="96" height="28" rx="6" fill="#1a213b" stroke="rgba(148,163,184,0.28)"/>
    <text x="72" y="115" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#94a3b8">7</text>

    <rect x="128" y="96" width="44" height="28" rx="6" fill="rgba(255,255,255,0.06)"/>
    <text x="150" y="115" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">in</text>

    <rect x="180" y="96" width="54" height="28" rx="6" fill="rgba(255,255,255,0.06)"/>
    <text x="207" y="115" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">the</text>

    <rect x="242" y="96" width="82" height="28" rx="6" fill="rgba(25, 228, 255, 0.18)" stroke="#19e4ff"/>
    <text x="283" y="115" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#19e4ff">SOLAR</text>

    <rect x="332" y="96" width="70" height="28" rx="6" fill="#1a213b" stroke="rgba(148,163,184,0.28)"/>
    <text x="367" y="115" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#94a3b8">4</text>

    <!-- Closest Semantic Ranks -->
    <text x="24" y="162" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#94a3b8" letter-spacing="1">SEMANTIC CLOSENESS RANKS</text>
    <rect x="24" y="176" width="118" height="34" rx="8" fill="rgba(255, 212, 94, 0.16)" stroke="#ffd45e"/>
    <text x="83" y="198" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#ffd45e">AURORA #1</text>

    <rect x="152" y="176" width="118" height="34" rx="8" fill="rgba(16, 185, 129, 0.16)" stroke="#10b981"/>
    <text x="211" y="198" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#6ee7b7">POLAR #4</text>

    <rect x="280" y="176" width="124" height="34" rx="8" fill="rgba(25, 228, 255, 0.14)" stroke="#19e4ff"/>
    <text x="342" y="198" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#19e4ff">SOLAR #9</text>

    <rect x="24" y="224" width="380" height="30" rx="8" fill="#080b14" stroke="rgba(255,255,255,0.15)"/>
    <text x="38" y="244" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Guess any word in the article or swipe keycaps...</text>
