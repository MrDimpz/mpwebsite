<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="wcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151b35"/>
      <stop offset="100%" stop-color="#070912"/>
    </linearGradient>
    <linearGradient id="wcCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19e4ff"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="28" fill="url(#wcBg)"/>
  <rect x="20" y="20" width="760" height="460" rx="22" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Top Badge -->
  <rect x="48" y="44" width="235" height="32" rx="16" fill="rgba(25, 228, 255, 0.14)" stroke="#19e4ff" stroke-width="1.5"/>
  <circle cx="68" cy="60" r="5" fill="#19e4ff"/>
  <text x="82" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#19e4ff" letter-spacing="1.2">WIKICONTEXTO × WIKIREC</text>

  <!-- Title -->
  <g transform="translate(48, 94)">
    <text x="0" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="30" font-weight="800" fill="#ffffff">WikiContexto</text>
    <text x="205" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="30" font-weight="800" fill="#19e4ff">Arena</text>
    <text x="0" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#94a3b8">Redacted Wikipedia Discovery + Semantic Closeness &amp; Live Chat</text>
  </g>

  <!-- Left Redacted Wikipedia Prose Card -->
