    <text x="125" y="205" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#ff7ab8">TIKTOK LIVE CHAT SYNC</text>

    <rect x="22" y="226" width="206" height="30" rx="8" fill="rgba(25, 228, 255, 0.12)" stroke="#19e4ff"/>
    <text x="125" y="246" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#19e4ff">KEY: LIVE-XXXX-XXXX</text>
  </g>
